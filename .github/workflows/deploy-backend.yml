name: Deploy Backend

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "What to deploy"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - specific
      specific_lambdas:
        description: "Comma-separated lambda names (only used when deploy_mode=specific). e.g. authorizer,user_data,ratings_all"
        required: false
        type: string
        default: ""
      deploy_common_layer:
        description: "Also redeploy the common layer"
        required: false
        type: boolean
        default: true

env:
  AWS_REGION: "us-east-1"
  # Terraform creates each lambda with a placeholder zip of a few hundred bytes.
  # Anything at or under this is a function whose real code never deployed.
  STUB_CODE_SIZE_BYTES: "1024"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      common_changed: ${{ steps.changes.outputs.common }}
      changed_lambdas: ${{ steps.changes.outputs.changed_lambdas }}
      all_lambdas: ${{ steps.all-lambdas.outputs.all_lambdas }}
      has_lambda_changes: ${{ steps.changes.outputs.has_lambda_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          DEPLOY_MODE="${{ github.event.inputs.deploy_mode }}"
          SPECIFIC_LAMBDAS="${{ github.event.inputs.specific_lambdas }}"
          DEPLOY_COMMON="${{ github.event.inputs.deploy_common_layer }}"

          if [ "$DEPLOY_MODE" == "all" ]; then
            echo "Deploy all requested - marking everything as changed"
            echo "common=true" >> $GITHUB_OUTPUT

            ALL_LAMBDAS=$(ls -d lambdas/*/ 2>/dev/null | grep -v "lambdas/common" | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "changed_lambdas=$ALL_LAMBDAS" >> $GITHUB_OUTPUT
            echo "has_lambda_changes=true" >> $GITHUB_OUTPUT
            echo "Deploying all lambdas: $ALL_LAMBDAS"

          elif [ "$DEPLOY_MODE" == "specific" ] && [ -n "$SPECIFIC_LAMBDAS" ]; then
            echo "Deploying specific lambdas: $SPECIFIC_LAMBDAS"

            if [ "$DEPLOY_COMMON" == "true" ]; then
              echo "common=true" >> $GITHUB_OUTPUT
            else
              echo "common=false" >> $GITHUB_OUTPUT
            fi

            # Convert comma-separated string to JSON array
            JSON_ARRAY=$(echo "$SPECIFIC_LAMBDAS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "changed_lambdas=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "has_lambda_changes=true" >> $GITHUB_OUTPUT
            echo "Selected lambdas: $JSON_ARRAY"

          else
            # Get changed files between current and previous commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Check if common layer changed
            if echo "$CHANGED_FILES" | grep -q "^lambdas/common/"; then
              echo "common=true" >> $GITHUB_OUTPUT
            else
              echo "common=false" >> $GITHUB_OUTPUT
            fi

            # Find changed lambda folders (excluding common) and format as JSON array
            CHANGED_LAMBDAS=$(echo "$CHANGED_FILES" | grep "^lambdas/" | grep -v "^lambdas/common/" | cut -d'/' -f2 | sort -u | grep -v '^$' || true)

            if [ -n "$CHANGED_LAMBDAS" ]; then
              # Convert to JSON array
              JSON_ARRAY=$(echo "$CHANGED_LAMBDAS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
              echo "changed_lambdas=$JSON_ARRAY" >> $GITHUB_OUTPUT
              echo "has_lambda_changes=true" >> $GITHUB_OUTPUT
              echo "Changed lambdas: $JSON_ARRAY"
            else
              echo "changed_lambdas=[]" >> $GITHUB_OUTPUT
              echo "has_lambda_changes=false" >> $GITHUB_OUTPUT
              echo "No lambda changes detected"
            fi
          fi

      - name: Get all lambda folders
        id: all-lambdas
        run: |
          # List all lambda folders except common and format as JSON array
          ALL_LAMBDAS=$(ls -d lambdas/*/ 2>/dev/null | grep -v "lambdas/common" | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "all_lambdas=$ALL_LAMBDAS" >> $GITHUB_OUTPUT
          echo "All lambdas: $ALL_LAMBDAS"

  test-lambdas:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_lambda_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.changed_lambdas) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov moto boto3
          pip install -r requirements.txt

      - name: Run tests for ${{ matrix.lambda }}
        run: |
          if [ -f "tests/test_${{ matrix.lambda }}.py" ]; then
            echo "Running tests for ${{ matrix.lambda }}"
            pytest tests/test_${{ matrix.lambda }}.py -v --cov=lambdas/${{ matrix.lambda }}
          else
            echo "⚠️  No tests found for ${{ matrix.lambda }}, skipping..."
          fi

  deploy-layer:
    needs: [detect-changes, test-lambdas]
    if: always() && needs.detect-changes.outputs.common_changed == 'true' && (needs.test-lambdas.result == 'success' || needs.test-lambdas.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      layer_arn: ${{ steps.deploy-layer.outputs.layer_arn }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Package layer
        run: |
          mkdir -p python/lambdas
          cp -r lambdas/common python/lambdas/
          python3.12 -m pip install --platform manylinux2014_x86_64 --only-binary=:all: -t python/ -r requirements.txt
          zip -r xomify-shared-packages.zip python

      - name: Deploy layer
        id: deploy-layer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          LAYER_OUTPUT=$(aws lambda publish-layer-version \
            --layer-name xomify-shared-packages \
            --zip-file fileb://xomify-shared-packages.zip \
            --compatible-runtimes python3.12 \
            --region $AWS_REGION \
            --output json)

          LAYER_ARN=$(echo $LAYER_OUTPUT | jq -r .LayerVersionArn)
          echo "layer_arn=$LAYER_ARN" >> $GITHUB_OUTPUT
          echo "Published layer: $LAYER_ARN"

  update-all-lambdas-layer:
    needs: [detect-changes, deploy-layer]
    if: always() && needs.detect-changes.outputs.common_changed == 'true' && needs.deploy-layer.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.all_lambdas) }}
      fail-fast: false
    steps:
      - name: Update lambda layer configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          FUNCTION_NAME="xomify-${{ matrix.lambda }}"
          # Convert underscores to hyphens for AWS function names
          FUNCTION_NAME=$(echo $FUNCTION_NAME | tr '_' '-')

          echo "Updating layer and runtime for $FUNCTION_NAME"
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --runtime python3.12 \
            --layers ${{ needs.deploy-layer.outputs.layer_arn }} \
            --region $AWS_REGION || echo "Function $FUNCTION_NAME not found, skipping..."

  deploy-changed-lambdas:
    needs: [detect-changes, test-lambdas, deploy-layer]
    if: always() && needs.detect-changes.outputs.has_lambda_changes == 'true' && (needs.test-lambdas.result == 'success' || needs.test-lambdas.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.changed_lambdas) }}
      fail-fast: false
      # Cap concurrency so we don't hammer the Lambda API (TooManyRequestsException)
      # when many functions change at once. Tune down further if throttling persists.
      max-parallel: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Package lambda
        run: |
          cd lambdas/${{ matrix.lambda }}
          zip -r ../../${{ matrix.lambda }}.zip *

      - name: Deploy lambda code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          FUNCTION_NAME="xomify-${{ matrix.lambda }}"
          # Convert underscores to hyphens for AWS function names
          FUNCTION_NAME=$(echo $FUNCTION_NAME | tr '_' '-')

          # Retry helper: up to 5 attempts w/ exponential backoff (3s, 6s, 12s, 24s
          # between attempts). Retries on ANY non-zero exit -- this covers both
          # Lambda API throttling (TooManyRequestsException / transient 5xx) AND the
          # just-created-function race (ResourceNotFoundException when this step runs
          # right after `terraform apply` and the function isn't visible to the
          # control plane yet). A short wait lets either condition clear on its own.
          # Idempotent: update-function-code/-configuration are safe to call again.
          retry_aws() {
            local desc="$1"; shift
            local max_attempts=5
            local delay=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "❌ $desc failed after $attempt attempts"
                return 1
              fi
              echo "⚠️  $desc failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
            echo "✅ $desc succeeded on attempt $attempt"
          }

          echo "Deploying code for $FUNCTION_NAME"
          retry_aws "update-function-code for $FUNCTION_NAME" \
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "fileb://${{ matrix.lambda }}.zip" \
              --region "$AWS_REGION"

          # Wait for function to finish updating before config change. Wrapped in
          # the same retry helper since the waiter's polling calls can also be
          # throttled under high fan-out.
          echo "Waiting for function update to complete..."
          retry_aws "wait function-updated (post code) for $FUNCTION_NAME" \
            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION"

          # Converge on the LATEST published layer, whether or not this run
          # rebuilt one.
          #
          # This used to run only when `deploy-layer` had published something,
          # which meant a deploy that touched no `lambdas/common/` file never
          # set `--layers` at all. A brand-new lambda then kept whatever
          # Terraform created it with -- the stub layer -- and every invoke died
          # on `Runtime.ImportModuleError: No module named 'jwt'`, with the
          # deploy showing green (#158).
          TARGET_LAYER="${{ needs.deploy-layer.outputs.layer_arn }}"
          if [ -z "$TARGET_LAYER" ]; then
            # --no-paginate matters: the CLI auto-pages, and --query is applied
            # PER PAGE, so without it this returns one ARN per page (196, 146,
            # 96, 46) as separate lines. --max-items has the same problem plus a
            # trailing pagination token. One page, newest first, is what's wanted.
            TARGET_LAYER=$(aws lambda list-layer-versions \
              --layer-name xomify-shared-packages \
              --no-paginate \
              --query 'LayerVersions[0].LayerVersionArn' \
              --output text \
              --region "$AWS_REGION")
          fi

          if [ -z "$TARGET_LAYER" ] || [ "$TARGET_LAYER" = "None" ]; then
            echo "❌ Could not resolve a layer version for $FUNCTION_NAME"
            exit 1
          fi

          # A read to skip a write. The steady state is "already on latest", and
          # update-function-configuration costs a wait and a window where the
          # function is Pending -- worth one cheap GET to avoid on every deploy.
          CURRENT_LAYER=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Layers[0].Arn' \
            --output text \
            --region "$AWS_REGION")

          if [ "$CURRENT_LAYER" = "$TARGET_LAYER" ]; then
            echo "✅ $FUNCTION_NAME already on $TARGET_LAYER"
          else
            echo "Attaching $TARGET_LAYER to $FUNCTION_NAME (was: $CURRENT_LAYER)"
            retry_aws "update-function-configuration for $FUNCTION_NAME" \
              aws lambda update-function-configuration \
                --function-name "$FUNCTION_NAME" \
                --layers "$TARGET_LAYER" \
                --region "$AWS_REGION"

            # Wait for config update to complete before declaring success, so a
            # ResourceConflictException can't leak into whatever runs next.
            echo "Waiting for configuration update to complete..."
            retry_aws "wait function-updated (post config) for $FUNCTION_NAME" \
              aws lambda wait function-updated \
                --function-name "$FUNCTION_NAME" \
                --region "$AWS_REGION"
          fi

          echo "✅ $FUNCTION_NAME deployment complete"

  # A deploy that reported green while every goals lambda still held the
  # Terraform stub is what this job exists to prevent (#158). update-function-code
  # succeeding is not evidence the function can import its handler.
  verify-deploy:
    needs: [detect-changes, deploy-changed-lambdas]
    if: always() && needs.detect-changes.outputs.has_lambda_changes == 'true' && needs.deploy-changed-lambdas.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed lambdas
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          LATEST_LAYER=$(aws lambda list-layer-versions \
            --layer-name xomify-shared-packages \
            --no-paginate \
            --query 'LayerVersions[0].LayerVersionArn' \
            --output text \
            --region "$AWS_REGION")

          FAILED=0
          for LAMBDA in $(echo '${{ needs.detect-changes.outputs.changed_lambdas }}' | jq -r '.[]'); do
            FUNCTION_NAME="xomify-$(echo $LAMBDA | tr '_' '-')"

            read -r LAYER SIZE <<< "$(aws lambda get-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --query '[Layers[0].Arn, CodeSize]' \
              --output text \
              --region "$AWS_REGION")"

            if [ "$LAYER" != "$LATEST_LAYER" ]; then
              echo "❌ $FUNCTION_NAME is on $LAYER, not $LATEST_LAYER"
              FAILED=1
            fi

            # The Terraform stub is a few hundred bytes. Any real handler is
            # larger, so this catches a function that was created but never had
            # its code deployed -- which is how the goals lambdas shipped dead.
            if [ "$SIZE" -lt "$STUB_CODE_SIZE_BYTES" ]; then
              echo "❌ $FUNCTION_NAME code is ${SIZE}B — still the Terraform stub"
              FAILED=1
            fi

            [ "$FAILED" -eq 0 ] && echo "✅ $FUNCTION_NAME on $LAYER (${SIZE}B)"
          done

          exit $FAILED

  summary:
    needs: [detect-changes, deploy-layer, update-all-lambdas-layer, deploy-changed-lambdas, verify-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Common layer changed: ${{ needs.detect-changes.outputs.common_changed }}"
          echo "Changed lambdas: ${{ needs.detect-changes.outputs.changed_lambdas }}"
          if [ "${{ needs.deploy-layer.outputs.layer_arn }}" != "" ]; then
            echo "New layer ARN: ${{ needs.deploy-layer.outputs.layer_arn }}"
          fi
          echo "=========================="
