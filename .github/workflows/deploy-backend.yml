name: Deploy Backend

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      lambdas:
        description: Comma-separated lambda folders to deploy. Empty deploys all.
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-lambda-python.yml@v1
    with:
      app: xomify
      lambdas: ${{ inputs.lambdas }}
      test-command: python -m pytest tests -q
